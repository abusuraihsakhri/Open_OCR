name: OpenOCR CI and Pages
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
      - name: Python syntax
        run: python -m compileall -q src
      - name: Python tests
        run: python -m unittest discover -s tests -p 'test_*.py' -v
      - name: Browser JavaScript syntax
        run: node --check docs/app.js
      - name: Browser JavaScript tests
        run: node --test tests/*.test.mjs
      - name: UI smoke test syntax
        run: node --check tests/ui-smoke.mjs
      - name: Install headless browser for UI smoke test
        run: |
          npm install --no-save playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Browser UI smoke test
        run: node tests/ui-smoke.mjs
      - name: Real OCR image and PDF integration
        run: node tests/ui-real.mjs
  pages:
    if: github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: docs
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify live page and assets
        env:
          SITE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          url="${SITE_URL%/}/"
          for attempt in $(seq 1 12); do
            if curl -fsSL --max-time 20 "$url" -o /tmp/openocr-index.html &&
               grep -Fq 'Turn documents into editable text.' /tmp/openocr-index.html &&
               curl -fsSL --max-time 20 "${url}app.js" -o /tmp/openocr-app.js &&
               grep -Fq 'validateFiles' /tmp/openocr-app.js &&
               curl -fsSL --max-time 20 "${url}styles.css" -o /tmp/openocr-styles.css; then
              echo "Live site and assets verified at $url"
              exit 0
            fi
            echo "Retrying live site check ($attempt/12)"
            sleep 5
          done
          echo "::error::GitHub Pages is not serving the expected application and assets"
          exit 1

